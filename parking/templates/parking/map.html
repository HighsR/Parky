{% extends "base.html" %}
{% load l10n %}

{% block title %}מפת חניות - Parky{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    #main-map {
        height: 600px;
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        z-index: 1;
    }
    .map-header {
        text-align: center;
        margin-bottom: 20px;
        direction: rtl;
    }
</style>

<div class="map-header">
    <h1>מצא חנייה ב-Parky</h1>
    <p>מציג חניות פעילות על המפה</p>
</div>

<div id="main-map"></div>

<script>
    var map = L.map('main-map').setView([31.989, 34.773], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var markerGroup = new L.featureGroup();
    var hasMarkers = false;

    {% for p in parkings %}
        {% if p.lat and p.lon %}
            {% localize off %}
            (function() {
                var lat = {{ p.lat }};
                var lon = {{ p.lon }};
                var name = "{{ p.name|escapejs }}";
                var address = "{{ p.address|escapejs }}";
                var price = "{{ p.price_per_hour }}";
                var bookUrl = "{% url 'book_parking' p.id %}";
                var rawRating = "{{ p.avg_rating }}";
                var reportUrl = "{% url 'report_parking_space' p.id %}";

                console.log("Adding marker for: " + name + " | Raw Rating: " + rawRating);

                var displayRating = rawRating;
                var parsedRating = parseFloat(rawRating);

                if (!isNaN(parsedRating) && parsedRating > 0) {
                    var numRating = Math.round(parsedRating);
                    var starsHtml = "";

                    for (var i = 1; i <= 5; i++) {
                        if (i <= numRating) {
                            starsHtml += "<span style='color: #ffc107; font-size: 16px;'>★</span>";
                        } else {
                            starsHtml += "<span style='color: #d3d3d3; font-size: 16px;'>★</span>";
                        }
                    }
                    displayRating = starsHtml + " <span style='font-size: 12px;'>(" + parsedRating.toFixed(1) + ")</span>";
                }
                else {
                    displayRating = "<span style='color: gray; font-style: italic;'>טרם דורג</span>";
                }

                var marker = L.marker([lat, lon])
                    .bindPopup(
                        '<div style="text-align: right; direction: rtl; font-family: \'Segoe UI\', Tahoma, Geneva, Verdana, sans-serif; min-width: 200px;">' +
                        '<h3 style="margin: 0 0 8px 0; font-size: 18px; color: #202124;">' + name + '</h3>' +
                        '<p style="margin: 0 0 5px 0; font-size: 14px; color: #5f6368;"><b>כתובת:</b> ' + address + '</p>' +
                        '<p style="margin: 0 0 5px 0; font-size: 14px; color: #5f6368;"><b>דירוג:</b> ' + displayRating + '</p>' +
                        '<p style="margin: 0 0 15px 0; font-size: 14px; color: #5f6368;"><b>מחיר:</b> ' + price + ' ש"ח לשעה</p>' +
                        '<a href="' + bookUrl + '" style="display: block; background-color: #1a73e8; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 8px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">להזמנה מהירה</a>' +
                        '<a href="'+ reportUrl + '" style="display: block; text-align: center; color: #d93025; background-color: #fff; border: 1px solid #d93025; padding: 6px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold;">דווח על בעיה</a>' +
                        '</div>'
                    );

                markerGroup.addLayer(marker);
                hasMarkers = true;
            })();
            {% endlocalize %}
        {% endif %}
    {% endfor %}

    markerGroup.addTo(map);

    if (hasMarkers) {
        map.fitBounds(markerGroup.getBounds().pad(0.1));
    } else {
        console.log("No valid markers found to display.");
    }
</script>
{% endblock %}
